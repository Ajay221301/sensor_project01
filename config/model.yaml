model_selection:
  model:
    XGBClassifier:
      search_param_grid:
        clf__learning_rate:
          - 0.1
          - 0.01
          - 0.001
        clf__max_depth:
          - 3
          - 5
          - 7
        clf__n_estimators:
          - 100
          - 200
          - 300
        clf__gamma:
          - 0
          - 0.1
          - 0.2

    GradientBoostingClassifier:
      search_param_grid:
        clf__n_estimators:
          - 100
        clf__criterion:
          - friedman_mse

    SVC:
      search_param_grid:
        clf__C:
          - 0.1
          - 1
          - 10
        clf__kernel:
          - linear
          - rbf
        clf__gamma:
          - 0.1
          - 0.01
          - 0.001

    RandomForestClassifier:
      search_param_grid:
        clf__n_estimators:
          - 100
          - 200
          - 300
        clf__max_depth:
          - null
          - 5
          - 10
        clf__min_samples_split:
          - 2
          - 5
          - 10
        clf__min_samples_leaf:
          - 1
          - 2
          - 4